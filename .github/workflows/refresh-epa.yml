name: Refresh NFL EPA
on:
  workflow_dispatch:
  schedule:
    # weekly_epa.py is idempotent: it makes no network calls unless a new Tuesday cutoff
    # is due, so delayed or repeated runs are harmless. Off-the-hour minute avoids cron congestion.
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  # Shared with the odds/weather workflow: both commit snapshots to main.
  group: main-snapshot-commits
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data updater dependencies
        run: python -m pip install -e .
      - name: Advance weekly EPA after Tuesday rollover
        run: python weekly_epa.py
      - name: Rebuild site
        run: python build_site.py
      - name: Commit refreshed EPA snapshot and HTML
        id: commit
        run: |
          echo 'changed=false' >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/epa_* docs/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Advance weekly EPA snapshot'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  # GITHUB_TOKEN commits do not trigger publish-site.yml, so deploy explicitly when PUBLISH_PAGES=true.
  deploy:
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
    needs: refresh
    if: needs.refresh.outputs.changed == 'true' && vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
