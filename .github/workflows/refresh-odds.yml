name: Refresh NFL odds and weather
on:
  workflow_dispatch:
  schedule:
    # UTC candidates cover both PST and PDT. The gate permits exactly 04:00/16:00 PT slots.
    - cron: '0 11,23 * * *'
    - cron: '0 0,12 * * *'
    # Sunday midnight PT is 07:00 UTC in PDT or 08:00 UTC in PST.
    - cron: '0 7,8 * * 0'
permissions:
  contents: write
concurrency:
  group: main-snapshot-commits
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Pacific schedule slot
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: python odds_schedule.py
      - name: Install data updater dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -e .
      - name: Capture kickoff weather independently of odds credentials
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'latest'
        run: python export_weather.py
      - name: Capture FanDuel snapshot
        if: steps.gate.outputs.run == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CAPTURE_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo '::warning::ODDS_API_KEY is missing; refreshing weather only. Add the Actions secret to enable odds.'
          elif [ "$CAPTURE_MODE" = 'opening' ]; then
            python export_odds.py --capture-opening || echo '::warning::Odds refresh failed; retaining prior odds.'
          else
            python export_odds.py || echo '::warning::Odds refresh failed; retaining prior odds.'
          fi
          python build_site.py
      - name: Commit refreshed snapshot and HTML
        id: commit
        if: steps.gate.outputs.run == 'true'
        run: |
          echo 'changed=false' >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/odds_2026.json reports/weather_2026.json docs/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh NFL odds and weather snapshots'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  # Optional: repository variable PUBLISH_PAGES=true enables explicit Pages deployment.
  # GITHUB_TOKEN commits alone do not trigger branch-based Pages builds.
  deploy:
    concurrency:
      group: github-pages-publish
      cancel-in-progress: false
    needs: refresh
    if: needs.refresh.outputs.changed == 'true' && vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
